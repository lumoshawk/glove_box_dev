# Drive TYPE definition: GCAN-GT-8221 EtherCAT slave <-> CANopen master gateway (probe layout).
vendor_id: 0x00000E0D
product_id: 0x00000004
assign_activate: 0x0000

sm:
  - {index: 0, type: output}
  - {index: 1, type: input}
  - {index: 2, type: output, pdo: rpdo, watchdog: enable}
  - {index: 3, type: input, pdo: tpdo, watchdog: disable}

rpdo:
  - index: 0x1600
    channels:
      - {index: 0x7000, sub_index: 1, type: uint8, command_interface: out0, default: 0}
      - {index: 0x7000, sub_index: 2, type: uint8, command_interface: out1, default: 0}
      - {index: 0x7000, sub_index: 3, type: uint8, command_interface: out2, default: 0}
      - {index: 0x7000, sub_index: 4, type: uint8, command_interface: out3, default: 0}
      - {index: 0x7000, sub_index: 5, type: uint8, command_interface: out4, default: 0}
      - {index: 0x7000, sub_index: 6, type: uint8, command_interface: out5, default: 0}
      - {index: 0x7000, sub_index: 7, type: uint8, command_interface: out6, default: 0}
      - {index: 0x7000, sub_index: 8, type: uint8, command_interface: out7, default: 0}
      - {index: 0x7000, sub_index: 9, type: uint8, command_interface: out8, default: 0}
      - {index: 0x7000, sub_index: 10, type: uint8, command_interface: out9, default: 0}

tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6000, sub_index: 1, type: uint8, state_interface: in0}
      - {index: 0x6000, sub_index: 2, type: uint8, state_interface: in1}
      - {index: 0x6000, sub_index: 3, type: uint8, state_interface: in2}
      - {index: 0x6000, sub_index: 4, type: uint8, state_interface: in3}
      - {index: 0x6000, sub_index: 5, type: uint8, state_interface: in4}
      - {index: 0x6000, sub_index: 6, type: uint8, state_interface: in5}
      - {index: 0x6000, sub_index: 7, type: uint8, state_interface: in6}
      - {index: 0x6000, sub_index: 8, type: uint8, state_interface: in7}
      - {index: 0x6000, sub_index: 9, type: uint8, state_interface: in8}
      - {index: 0x6000, sub_index: 10, type: uint8, state_interface: in9}
