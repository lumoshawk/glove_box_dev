# Drive TYPE definition: EYOU PHU/RHU joint module (CiA402). Migrated from the tested
# ~/RTRW/eyou_jazzy_ws/eyou_feedback_test/drive.yaml; PDO map and defaults are unchanged.
# Shared by every EYOU module; per-motor values live in config/profiles/<motor>.yaml.
# Values are raw drive units (no scaling). Interface names are generic (position, velocity, torque, ...) and shared with the other drive packages.

# Identity as discovered by `ethercat slaves -v`. The SDO 0x1018:02 reads 0x00020001 instead;
# the master matches on the discovered value. Verify with `ros2 run eyou_ethercat ec_tool scan`.
vendor_id: 0x00001097
product_id: 0x00010002
assign_activate: 0x0300  # DC sync, inherited from the supplied EYOU config

# No startup SDOs defined for this drive type yet (the tested setup wrote none).
parameters: {}

rpdo:  # master -> drive, mapping 0x1600 (10 entries)
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0}
      - {index: 0x6060, sub_index: 0, type: int8, command_interface: mode, default: 8}  # 8 = CSP, 3 = PV
      - {index: 0x607A, sub_index: 0, type: int32, command_interface: target_position, default: 0}
      - {index: 0x6081, sub_index: 0, type: uint32, command_interface: profile_velocity, default: 13107201}
      - {index: 0x60FF, sub_index: 0, type: int32, command_interface: target_velocity, default: 0}
      - {index: 0x240D, sub_index: 0, type: uint32, command_interface: torque_velocity_limit, default: 26214402}
      - {index: 0x6071, sub_index: 0, type: int16, command_interface: target_torque, default: 0}
      - {index: 0x6083, sub_index: 0, type: uint32, command_interface: profile_accel, default: 40195416}
      - {index: 0x6084, sub_index: 0, type: uint32, command_interface: profile_decel, default: 40195416}
      - {index: 0x6087, sub_index: 0, type: uint32, command_interface: torque_slope, default: 0}

tpdo:  # drive -> master, mapping 0x1A00 (10 entries)
  - index: 0x1A00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word}
      - {index: 0x6061, sub_index: 0, type: int8, state_interface: mode_display}
      - {index: 0x603F, sub_index: 0, type: uint16, state_interface: error_code}
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position}
      - {index: 0x606C, sub_index: 0, type: int32, state_interface: velocity}
      - {index: 0x6077, sub_index: 0, type: int16, state_interface: torque}
      - {index: 0x6074, sub_index: 0, type: int16, state_interface: torque_demand}
      - {index: 0x60F4, sub_index: 0, type: int32, state_interface: following_error}
      - {index: 0x6079, sub_index: 0, type: uint32, state_interface: dc_link_voltage}
      - {index: 0x60FD, sub_index: 0, type: uint32, state_interface: digital_inputs}
