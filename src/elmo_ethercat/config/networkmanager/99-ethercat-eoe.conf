# Keep NetworkManager away from the EoE interfaces (eoe0s5, ...) that the IgH master creates for EoE slaves.
# DHCP / IPv6 traffic on them fills the Elmo drive's mailbox and its SDO setup times out.
# Install: sudo cp 99-ethercat-eoe.conf /etc/NetworkManager/conf.d/ && sudo systemctl reload NetworkManager
[keyfile]
unmanaged-devices=interface-name:eoe*
